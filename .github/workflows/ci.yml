# Continuous integration (M11). Runs the same gate as the project's local check: formatting, clippy with warnings denied,
# the workspace tests, the shim typecheck, and two repository checks. GPU runs and the benchmark stay manual (D2).
name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for native-tls
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck the OpenCode shim against the pinned plugin
        working-directory: opencode-plugin
        run: npm ci && npm run typecheck

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No model weights in the repository (AC-R4)
        run: |
          if git ls-files | grep -E '\.(gguf|safetensors|bin|pt|onnx)$'; then
            echo "model weights are tracked"; exit 1
          fi
      - name: Third-party licence list is current (R-52.1)
        run: |
          python3 scripts/third_party_licenses.py
          git diff --exit-code THIRD_PARTY_LICENSES.md
