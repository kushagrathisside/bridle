[workspace]
resolver = "3"
members = ["crates/harness-core", "crates/harness-runtime", "crates/harness-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# Project licence pending PM decision (audit §Q1); crates are not published until then.
publish = false
repository = ""

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
harness-runtime = { path = "crates/harness-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
sha2 = "0.11.1"
# Plain HTTP only in M1: every default endpoint is loopback. TLS is added behind a
# feature when external providers arrive (M7/M8), so local-only builds cannot do HTTPS.
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
dunce = "1.0.5"
humantime = "2.4.0"
tempfile = "3.27.0"
# Code intelligence (ADR-0003). Exact pins: the grammars are versioned with tree-sitter.
tree-sitter = "=0.27.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-cpp = "=0.23.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
