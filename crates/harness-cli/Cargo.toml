[package]
name = "harness-cli"
description = "The `agent` command-line interface and the OpenCode host adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The binary name is part of the temporary product identity (see harness-core::identity).
[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
harness-core.workspace = true
harness-runtime.workspace = true
serde.workspace = true
# preserve_order: OpenCode evaluates permission rules in insertion order.
serde_json = { workspace = true, features = ["preserve_order"] }
dunce.workspace = true
sha2.workspace = true
anyhow.workspace = true
clap.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
