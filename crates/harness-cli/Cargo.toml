[package]
name = "harness-cli"
description = "The Bridle command-line interface, the chat agent loop and the OpenCode host adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The headless command-line program. Users run `bridle` (the desktop crate), which includes the same commands.
[[bin]]
name = "bridle-cli"
path = "src/main.rs"

[dependencies]
harness-core.workspace = true
harness-runtime.workspace = true
serde.workspace = true
# preserve_order: OpenCode evaluates permission rules in insertion order.
serde_json = { workspace = true, features = ["preserve_order"] }
dunce.workspace = true
ratatui.workspace = true
humantime.workspace = true
sha2.workspace = true
anyhow.workspace = true
clap.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
